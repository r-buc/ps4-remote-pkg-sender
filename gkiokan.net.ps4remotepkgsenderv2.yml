app-id: gkiokan.net.ps4remotepkgsenderv2
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_TRASH=gio

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: ps4-remote-pkg-sender
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/ps4-remote-pkg-sender/flatpak-node/cache
        npm_config_cache: /run/build/ps4-remote-pkg-sender/flatpak-node/npm-cache
        npm_config_offline: 'true'
        electron_config_cache: /run/build/ps4-remote-pkg-sender/flatpak-node/cache
        ELECTRON_CACHE: /run/build/ps4-remote-pkg-sender/flatpak-node/cache/electron
        ELECTRON_BUILDER_CACHE: /run/build/ps4-remote-pkg-sender/flatpak-node/cache/electron-builder
        ELECTRON_BUILDER_OFFLINE: 'true'
    build-commands:
      # Strip non-Linux targets and set a dir-only Linux build so electron-builder
      # doesn't try to download anything extra inside the offline sandbox.
      - jq 'del(.build.win, .build.mac, .build.dmg, .build.publish, .repository) | .build.linux.target="dir"' package.json > package.json.tmp && mv package.json.tmp package.json
      # Install all npm dependencies from the offline cache provided by flatpak-node-sources.json
      - npm install --offline --legacy-peer-deps
      # Build the Electron app (electron-vite + electron-builder --linux --dir)
      - npm run build:linux:dir
      - cp -a release/linux-unpacked /app/main
      # Install the launcher wrapper
      - install -Dm755 -t /app/bin/ run.sh
      # build/icon.png (512x512) is committed to the repository
      - install -Dm644 build/icon.png /app/share/icons/hicolor/512x512/apps/gkiokan.net.ps4remotepkgsenderv2.png
      # build/gkiokan.net.ps4remotepkgsenderv2.desktop is committed to the repository
      - install -Dm644 build/gkiokan.net.ps4remotepkgsenderv2.desktop /app/share/applications/gkiokan.net.ps4remotepkgsenderv2.desktop
      # Install AppStream metadata
      - install -Dm644 gkiokan.net.ps4remotepkgsenderv2.metainfo.xml /app/share/metainfo/gkiokan.net.ps4remotepkgsenderv2.metainfo.xml
    sources:
      - type: dir
        path: .
      - flatpak-node-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/ps4remotepkgsenderv2 --ozone-platform=wayland --disable-features=Vulkan,VulkanFromANGLE,DefaultANGLEVulkan --use-gl=egl --enable-features=WaylandWindowDecorations --enable-logging "$@"
